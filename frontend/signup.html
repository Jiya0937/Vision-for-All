<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | BrailleAI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page-body">

  <!-- Background Blobs -->
  <div class="bg-glow-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <canvas id="particles-canvas"></canvas>

  <!-- Signup Card -->
  <div class="auth-card-glass">
    <div class="auth-header">
      <a href="index.html" class="auth-logo">Braille<span>AI</span></a>
      <h2 class="auth-title">Create Account</h2>
      <p class="auth-subtitle">Join us to translate Braille with YOLOv8 & OpenCV</p>
    </div>

    <!-- Error message alert -->
    <div id="error-alert" class="auth-error-msg">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span id="error-text">Registration failed</span>
    </div>

    <form id="signup-form" class="auth-form">
      <!-- Full Name -->
      <div class="form-group">
        <label for="name" class="form-label">Full Name</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <input type="text" id="name" class="form-input" placeholder="Sandhya Vishwakarma" required autocomplete="name">
        </div>
      </div>

      <!-- Email Field -->
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          <input type="email" id="email" class="form-input" placeholder="name@domain.com" required autocomplete="email">
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password" class="form-label">Password (Min 6 chars)</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="new-password">
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="confirm-password" class="form-label">Confirm Password</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input type="password" id="confirm-password" class="form-input" placeholder="••••••••" required autocomplete="new-password">
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-auth-submit">Create Account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login.html" class="auth-footer-link">Login</a>
    </div>
  </div>

  <script>
    // Particle Animation logic
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2.5 + 0.5;
        this.speedX = Math.random() * 0.4 - 0.2;
        this.speedY = Math.random() * 0.4 - 0.2;
        this.alpha = Math.random() * 0.5 + 0.1;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
        if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = '#7c3aed';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function init() {
      for (let i = 0; i < 45; i++) {
        particles.push(new Particle());
      }
    }
    init();

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animate);
    }
    animate();

    // Signup Form Processing
    const signupForm = document.getElementById('signup-form');
    const errorAlert = document.getElementById('error-alert');
    const errorText = document.getElementById('error-text');

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      // Email Format Check
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showError('Please enter a valid email address.');
        return;
      }

      // Password Length Check
      if (password.length < 6) {
        showError('Password must be at least 6 characters long.');
        return;
      }

      // Password Match Check
      if (password !== confirmPassword) {
        showError('Passwords do not match.');
        return;
      }

      try {
        const response = await fetch('/api/signup', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ name, email, password, confirmPassword })
        });

        const result = await response.json();

        if (result.success) {
          // Success: redirect to login
          alert('Registration successful! Please login.');
          window.location.href = 'login.html';
        } else {
          showError(result.message || 'Registration failed.');
        }
      } catch (err) {
        console.error('Signup request failed:', err);
        showError('Could not connect to server. Please ensure the backend is running.');
      }
    });

    function showError(msg) {
      errorText.textContent = msg;
      errorAlert.style.display = 'flex';
    }
  </script>
</body>
</html>
